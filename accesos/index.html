<h1 style="position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)">MolarDash</h1><p class="sub">Accesos · quién puede entrar a MolarDash</p>
<div id="msg"></div>
<div id="gbtn" style="display:flex;justify-content:center;min-height:44px"><span class="muted" style="margin:0">Cargando…</span></div>

<script>
// El botón "Volver a MolarDash" del panel deja #/inicio: eso es la aplicación
if(/^#\/(?!accesos|admin)/.test(location.hash)) location.replace('/app/'+location.hash);
</script>
<script>
(()=>{
const SUPABASE_URL='https://quxegznlgbzrtrqlqxgq.supabase.co';
const SUPABASE_KEY='sb_publishable_hEFzoaq8yS2JckeRq9UYhw_Qm9AHuSG';
const GOOGLE_CLIENT_ID='181500076037-96bglt3ct8dahrojslqfr2nlf5pg012g.apps.googleusercontent.com';
const $=s=>document.querySelector(s);
/* Animación de apertura (claro): una vez por pestaña; la app se muestra cuando termina o al tocar "Saltar" */
const splashListo=new Promise(fin=>{
  const sp=$('#splash'), v=$('#intro'); let hecho=false;
  const listo=()=>{ if(hecho) return; hecho=true; fin(); };
  let visto=false; try{ visto=sessionStorage.getItem('md_intro')==='1'; sessionStorage.setItem('md_intro','1'); }catch(e){}
  if(visto){ sp.remove(); return listo(); }
  if(matchMedia('(prefers-reduced-motion: reduce)').matches){ v.remove(); setTimeout(listo,700); return; }
  v.addEventListener('ended',listo); v.addEventListener('error',listo);
  $('#saltar').addEventListener('click',listo); sp.addEventListener('click',listo);
  v.play().catch(()=>setTimeout(listo,900));   // si el navegador no deja reproducir, se ve el logo un momento
  setTimeout(listo,5000);                      // nunca bloquea más de 5 s
});
function quitarSplash(){ const sp=$('#splash'); if(!sp) return; sp.classList.add('fuera'); setTimeout(()=>sp.remove(),460); }
splashListo.then(()=>{ if(!document.body.dataset.abriendo) quitarSplash(); });
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'})[c]);
const sb=supabase.createClient(SUPABASE_URL,SUPABASE_KEY,{auth:{persistSession:true,autoRefreshToken:true,detectSessionInUrl:false}});
const wait=(f,ms=15000)=>new Promise((ok,ko)=>{const t0=Date.now();(function r(){if(f())return ok();if(Date.now()-t0>ms)return ko(new Error('No se pudo cargar Google. Revisa tu conexión.'));setTimeout(r,80)})()});
async function sha256hex(t){const b=await crypto.subtle.digest('SHA-256',new TextEncoder().encode(t));return [...new Uint8Array(b)].map(x=>x.toString(16).padStart(2,'0')).join('')}
function msg(t){$('#msg').innerHTML=t?`<div class="info">${esc(t)}</div>`:''}
async function cargarApp(){
  $('#gbtn').innerHTML='<span class="muted" style="margin:0">Abriendo MolarDash…</span>'; $('#hint').textContent='';
  const {data:estado,error:eAcc}=await sb.rpc('mi_acceso');
  const sinMigracion=eAcc&&eAcc.code==='PGRST202'; // la base aún no tiene la aprobación de accesos
  if(!sinMigracion&&(eAcc||estado!=='aprobado')){
    delete document.body.dataset.abriendo; splashListo.then(quitarSplash);
    await sb.auth.signOut();
    msg(estado==='bloqueado'?'Tu acceso a MolarDash está desactivado. Pide al administrador que lo active.'
       :estado==='pendiente'?'Recibimos tu solicitud. Podrás entrar a MolarDash en cuanto el administrador la apruebe.'
       :'No se pudo verificar tu acceso. Intenta de nuevo en un momento.');
    return mostrarLogin();
  }
  document.body.dataset.abriendo='1';
  const {data,error}=await sb.from('app_bundle').select('html').eq('id','accesos').maybeSingle();
  if(error||!data){
    // Solo el administrador de MolarDash recibe el panel; los demás conservan su sesión para la aplicación
    delete document.body.dataset.abriendo; quitarSplash();
    $('#gbtn').innerHTML='<a href="/app/" style="display:inline-block;background:#0f1b2d;color:#fff;border-radius:999px;padding:10px 22px;font-weight:600;text-decoration:none">Ir a la aplicación</a>';
    $('#hint').innerHTML='<a href="#" id="otra" style="color:#5b6b82">Entrar con otra cuenta</a>';
    $('#otra').onclick=async e=>{ e.preventDefault(); await sb.auth.signOut(); msg(''); mostrarLogin(); };
    msg('Esta cuenta no administra los accesos de MolarDash.'); return;
  }
  history.replaceState(null,'','/accesos/#/accesos');
  await splashListo;
  document.open(); document.write(data.html); document.close();
}
function errorIngreso(e){
  const t=String(e?.message||e||'');
  return /banned/i.test(t)?'Tu acceso a MolarDash está desactivado. Pide al administrador que lo active.':'No se pudo iniciar sesión: '+t;
}
async function mostrarLogin(){
  $('#hint').textContent='Entra con la cuenta de Google del administrador.';
  try{
    await wait(()=>window.google?.accounts?.id);
    const raw=crypto.randomUUID()+crypto.randomUUID(), hashed=await sha256hex(raw);
    google.accounts.id.initialize({client_id:GOOGLE_CLIENT_ID,nonce:hashed,auto_select:false,itp_support:true,callback:async r=>{
      $('#gbtn').innerHTML='<span class="muted" style="margin:0">Entrando…</span>';
      const {error}=await sb.auth.signInWithIdToken({provider:'google',token:r.credential,nonce:raw});
      if(error){ msg(errorIngreso(error)); return mostrarLogin(); }
      cargarApp();
    }});
    $('#gbtn').innerHTML='';
    google.accounts.id.renderButton($('#gbtn'),{theme:'filled_blue',size:'large',text:'signin_with',shape:'pill',locale:'es',width:300});
  }catch(e){ msg(e.message||String(e)); }
}
(async()=>{ const {data}=await sb.auth.getSession(); if(data.session) cargarApp(); else mostrarLogin(); })();
})();
</script>
